openapi: 3.0.0
info:
  title: API de Integração - Scua Logon
  version: 1.0.0
  description: '## Por que alguns endpoints de listagem usam POST em vez de GET


    Vários endpoints de listar/buscar (`holiday/list`, `users/listar`, `workinghours/list`, etc.) usam
    `POST` mesmo sendo operações de leitura. Não é erro de documentação: eles aceitam uma lista dinâmica
    de filtros no corpo da requisição, e GET com corpo não é bem suportado pela maioria dos clientes HTTP.
    Enviar corpo vazio (`[]`) retorna a lista completa, sem filtro.


    ---


    ## Como autenticar


    1. Chame `POST /public/logon/login` com `txtLogin` e `txtSenha` (ou `txtSenha: "Azure"` quando a autenticação
    via Azure AD estiver habilitada nesta instância).

    2. Pegue o campo `token` da resposta 200 — é um **UUID opaco**, não é JWT (não dá para decodificar/inspecionar
    o conteúdo dele, o servidor é quem sabe a quem ele pertence).

    3. Envie esse token em toda chamada seguinte no header `Authorization: Bearer <token>`. Alternativa
    aceita pelo servidor quando não é possível setar header (ex: link direto de download de relatório
    em XLS): query string `?t=<token>`.

    4. **Não há expiração automática de token.** O token vive num mapa em memória no processo da API —
    só é invalidado por (a) chamar `GET /logoncontrol/user/logout`, ou (b) reiniciar a aplicação (derruba
    todas as sessões ativas de uma vez, de todos os usuários). Não trate a ausência de expiração como
    garantia — feche a sessão explicitamente via logout quando o uso terminar.

    5. Rotas sob `/public/**` (login, teste de conectividade, telemetria de uso) não exigem token. Todo
    o resto exige um token válido — não existem endpoints "meio protegidos" nesta API.


    ### Permissões retornadas no login


    O login devolve uma lista de `roles` e flags booleanas (`admin`, `rh`, `producao`, `sustentacao`)
    derivadas dela. Nem todo endpoint aceita a mesma combinação de papéis — cada um decide o que aceita.


    | Role (nome interno) | Flag equivalente | Uso típico |

    |---|---|---|

    | `ROLE_ADMIN_LOGON` | `admin` | Administração geral do SCUA Logon (usuários, feriados, parâmetros...)
    |

    | `ROLE_RH_LOGON` | `rh` | Recursos Humanos — aprovações e relatórios de jornada |

    | `ROLE_PRODUCAO_LOGON` | `producao` | Perfil de produção/operação |

    | `ROLE_SUSTENTACAO_LOGON` | `sustentacao` | Suporte/sustentação — acesso amplo para diagnóstico |

    | `ROLE_GESTOR` | — (implícita) | Atribuída automaticamente a quem é gestor ou gestor substituto de
    alguém — não vem do banco |

    | `ROLE_USER` | — | Usuário comum, sem papel administrativo |


    Os nomes de role não são um contrato fixo por endpoint — vários aceitam mais de uma combinação (ex:
    os endpoints de feriados aceitam ADMIN, ADMIN_LOGON, RH ou SUSTENTACAO). Onde a combinação aceita
    já foi confirmada no código, isso está anotado na descrição do endpoint específico.


    ### O que já foi auditado


    Confirmado direto no `SpringSecurityConfig` do backend: só rotas sob `/public/**` (mais `/actuator/health`
    e `/actuator/prometheus`, que não fazem parte desta documentação — são endpoints de infraestrutura)
    dispensam token. Isso bate exatamente com as 3 rotas já marcadas `security: []` neste arquivo — nenhuma
    rota adicional precisou de ajuste nesta auditoria.

    '
servers:
- url: https://scua-logon-api-mock.scua-logon-dev.workers.dev
  description: Mock gratuito (Cloudflare Workers) - use o botao "Test Request" aqui em cima com este servidor
    selecionado. Devolve exemplo real para os endpoints ja documentados na Fase 1 (login, users/listar,
    holiday/delete/{id}) e 501 honesto para os demais - nao grava nada de verdade, seguro para qualquer
    parceiro testar a vontade. Ver mock/README.md no repositorio.
- url: http://localhost:8080
  description: Ambiente de exemplo/desenvolvimento — nao utilizavel externamente. Aponte para a URL da
    sua instancia SCUA Logon.
- url: http://localhost:3090
  description: Ambiente de exemplo/desenvolvimento — nao utilizavel externamente. Aponte para a URL da
    sua instancia SCUA Logon.
- url: http://localhost:8095
  description: Ambiente de exemplo/desenvolvimento — nao utilizavel externamente. Aponte para a URL da
    sua instancia SCUA Logon.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
- bearerAuth: []
tags:
- name: Autenticação
- name: Feriados
- name: Usuários (Colaboradores)
- name: Jornadas de Trabalho
- name: Tipos de Jornada
- name: Férias e Afastamentos
  description: Períodos de férias e qualquer outro afastamento (licença, atestado etc.) — mesmo endpoint
    para os dois, ver descrição das operações.
paths:
  /logoncontrol/user/logout:
    get:
      tags:
      - Autenticação
      summary: Logout
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: true se havia sessão ativa e ela foi encerrada.
          content:
            application/json:
              schema:
                type: boolean
      description: 'Encerra a sessão do token usado na chamada (o mesmo token enviado no header `Authorization:
        Bearer`). Depois disso esse token para de funcionar em qualquer outro endpoint — é preciso fazer
        login de novo para obter um token novo.'
  /logoncontrol/public/logon/login:
    post:
      tags:
      - Autenticação
      summary: Login
      description: Endpoint de login utilizando usuario e senha. Retorna o token para acesso as outras
        APIs e as permissões de acesso do usuario em questão.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - txtLogin
              - txtSenha
              properties:
                txtLogin:
                  type: string
                  description: Login do usuário.
                txtSenha:
                  type: string
                  description: Senha em texto puro, ou a string literal 'Azure' quando a autenticação
                    é via Azure AD (fluxo separado, feature flag SCUA_LOGON_AUTH_TYPES).
              example:
                txtLogin: usuario.exemplo
                txtSenha: senha
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Login bem-sucedido. O campo `token` é um UUID opaco (não é JWT) — o servidor valida
            esse token contra um mapa mantido em memória no processo Java (`loggedUsers`). Não há expiração
            automática visível no código atual; confirmar com o time antes de assumir TTL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codUsuario:
                    type: integer
                  nomUsuario:
                    type: string
                  txtLogin:
                    type: string
                  txtEmail:
                    type: string
                  codObjeto:
                    type: integer
                  token:
                    type: string
                    description: UUID opaco, usar em chamadas subsequentes.
                  roles:
                    type: array
                    items:
                      type: string
                    description: 'Roles do usuário (ex: ROLE_ADMIN_LOGON, ROLE_GESTOR).'
                  acoes:
                    type: array
                    items:
                      type: object
                    description: Permissões granulares do usuário.
        '400':
          description: Usuário não encontrado (nem no banco local, nem no AD/Azure AD).
          content:
            application/json: {}
        '401':
          description: Credencial inválida, ou usuário desativado.
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de erro em texto simples.
        '500':
          description: Erro inesperado durante o processo de login.
          content:
            application/json: {}
      security: []
  /logoncontrol/holiday/list:
    post:
      tags:
      - Feriados
      summary: List
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: []
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: size
        in: query
        schema:
          type: integer
        example: '20'
      - name: page
        in: query
        schema:
          type: integer
        example: '0'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: &id002
                      type: object
                      properties:
                        code:
                          type: integer
                          description: Id do grupo de feriado (codConcessaoFeriadoIdentificador).
                        name:
                          type: string
                        description:
                          type: string
                        feriados:
                          type: array
                          items: &id001
                            type: object
                            properties:
                              code:
                                type: integer
                                description: Id da própria data (usar em /holiday/delete/date/{code}).
                              codeId:
                                type: integer
                                description: Id do grupo de feriado ao qual esta data pertence.
                              name:
                                type: string
                              date:
                                type: string
                                description: Formato dd/MM/yyyy.
                              begin:
                                type: string
                                description: Formato HH:mm.
                              end:
                                type: string
                                description: Formato HH:mm.
                              recurrent:
                                type: boolean
                                description: Se true, a data se repete todo ano (o ano gravado no servidor
                                  é fixo, 2000, e ignorado na comparação).
                              national:
                                type: boolean
                          description: Datas cadastradas neste grupo (pode vir omitido/vazio dependendo
                            do endpoint).
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
      description: 'Lista os grupos de feriado cadastrados (ex: "Feriados Nacionais"), paginado. Um grupo
        pode conter várias datas — ver `/holiday/list/date/{code}` para as datas de um grupo específico.'
  /logoncontrol/holiday/list/date/2:
    post:
      tags:
      - Feriados
      summary: List Dates
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items: *id001
      description: Lista as datas cadastradas dentro de um grupo de feriado específico (`code` = id do
        grupo, retornado por `/holiday/list`).
  /logoncontrol/holiday/save:
    post:
      tags:
      - Feriados
      summary: Save
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codConcessaoFeriadoIdentificador:
                  type: integer
                  description: Omitir para criar um grupo novo.
                nome:
                  type: string
                descricao:
                  type: string
              example:
                nome: Feriados Nacionais
                descricao: Feriados que valem para todo o Brasil
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Id do grupo (criado ou atualizado).
          content:
            application/json:
              schema:
                type: integer
      description: Cria ou atualiza um grupo de feriado (nome + descrição). Não enviar `codConcessaoFeriadoIdentificador`
        para criar um grupo novo; enviar o campo preenchido atualiza o grupo existente com esse código.
  /logoncontrol/holiday/save/date:
    post:
      tags:
      - Feriados
      summary: Save Dates
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - feriadoId
              - nomFeriado
              - data
              - inicio
              - fim
              properties:
                codConcessaoFeriado:
                  type: integer
                  description: Omitir para criar uma data nova.
                nomFeriado:
                  type: string
                data:
                  type: string
                  format: date
                  description: Data do feriado. Se recorrente=true, o ano é substituído por 2000 no servidor
                    e ignorado nas comparações.
                inicio:
                  type: string
                  format: date-time
                fim:
                  type: string
                  format: date-time
                recorrente:
                  type: boolean
                nacional:
                  type: boolean
                feriadoId:
                  type: object
                  properties:
                    codConcessaoFeriadoIdentificador:
                      type: integer
                  description: Grupo ao qual esta data pertence.
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Id da data (criada ou atualizada).
          content:
            application/json:
              schema:
                type: integer
      description: 'Adiciona ou atualiza uma data dentro de um grupo de feriado já existente (ex: "Carnaval"
        em 12/02/2027). Marcar `recorrente: true` faz a data valer todo ano (o ano informado é ignorado
        pelo servidor). Não enviar `codConcessaoFeriado` para criar uma data nova nesse grupo.'
  /logoncontrol/holiday/delete/date/19:
    post:
      tags:
      - Feriados
      summary: Delete Date
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      responses:
        '200':
          description: Id da data removida (o mesmo enviado no path).
          content:
            application/json:
              schema:
                type: integer
      description: Remove uma data específica de um grupo de feriado (`code` = id da própria data, não
        do grupo).
  /logoncontrol/holiday/relatedTo/212108316:
    post:
      tags:
      - Feriados
      summary: Associa
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
              description: Ids de grupos de feriado a vincular ao usuário.
              example:
              - 1
              - 2
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
      description: Vincula um ou mais grupos de feriado a um usuário (`codObjeto` no path; corpo = array
        de ids de grupo de feriado). Define quais feriados valem para esse usuário. Ver `/holiday/list/holiday/available/{code}`
        para saber quais grupos ainda podem ser vinculados.
  /logoncontrol/holiday/list/holiday/available/212108316:
    post:
      tags:
      - Feriados
      summary: List Disponiveis
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items: *id002
      description: Lista os grupos de feriado que AINDA NÃO estão vinculados a um usuário (`code` = codObjeto)
        — usar antes de chamar `relatedTo` para saber o que ainda pode ser adicionado.
  /logoncontrol/holiday/list/holiday/212108316:
    post:
      tags:
      - Feriados
      summary: List Selecionados
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items: *id002
      description: Lista os grupos de feriado JÁ vinculados a um usuário (`code` = codObjeto).
  /logoncontrol/users/listar:
    post:
      tags:
      - Usuários (Colaboradores)
      summary: users/listar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
              - property: ''
                value: ''
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: order
        in: query
        schema:
          type: string
        example: manager
      - name: direction
        in: query
        schema:
          type: string
        example: DESC
      - name: page
        in: query
        schema:
          type: integer
        example: '1'
      - name: query
        in: query
        schema:
          type: string
        example: user4
      responses:
        '200':
          description: Página (Spring Data `Page`) de usuários. Campos de paginação padrão (`content`,
            `totalElements`, `totalPages`, `number`, `size`, `first`, `last`, `empty`) envolvem uma lista
            de `LogonUser` — DTO real do backend, não a entidade de banco.
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo:
                          type: integer
                        login:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        dominio:
                          type: string
                        admin:
                          type: boolean
                        rh:
                          type: boolean
                        producao:
                          type: boolean
                        sustentacao:
                          type: boolean
                        excecao:
                          type: boolean
                        ativo:
                          type: boolean
                        blocked:
                          type: boolean
                        codObjeto:
                          type: integer
                        codHorario:
                          type: integer
                        codObjetoManager:
                          type: integer
                        department:
                          type: string
                        numSessoes:
                          type: integer
                        enviaEmail:
                          type: boolean
                        inOvertime:
                          type: boolean
                        inInterworkRestPeriod:
                          type: boolean
                        inBreaktime:
                          type: boolean
                        acoes:
                          type: array
                          items:
                            type: object
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                    description: Página atual (0-indexed).
                  size:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
        '500':
          description: Erro inesperado ao montar a listagem.
          content:
            application/json: {}
      description: 'Lista os usuários (colaboradores) cadastrados, com paginação e busca.


        ---


        **Por que POST em vez de GET?** Este endpoint aceita uma lista dinâmica de filtros (`[{"property":
        "...", "operator": "...", "value": "..."}]`) no corpo da requisição — é uma operação de leitura
        (não grava nada), mas precisa de corpo porque a quantidade e combinação de filtros é variável,
        e requisições GET com corpo não são bem suportadas por clientes HTTP/proxies em geral. Mesmo padrão
        usado por várias APIs de busca (ex: Elasticsearch `_search`). Enviar `[]` retorna a lista sem
        filtro.'
  /logoncontrol/users/listar/manager:
    post:
      tags:
      - Usuários (Colaboradores)
      summary: users/listar/manager
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: []
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: cod_objeto
        in: query
        schema:
          type: string
      - name: login
        in: query
        schema:
          type: string
      - name: query
        in: query
        schema:
          type: string
      - name: ativo
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
        example: '0'
      - name: size
        in: query
        schema:
          type: integer
        example: '20'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items: &id003
                  type: object
                  properties:
                    codigo:
                      type: integer
                    login:
                      type: string
                    name:
                      type: string
                    email:
                      type: string
                    dominio:
                      type: string
                    admin:
                      type: boolean
                    rh:
                      type: boolean
                    producao:
                      type: boolean
                    sustentacao:
                      type: boolean
                    excecao:
                      type: boolean
                    ativo:
                      type: boolean
                    blocked:
                      type: boolean
      description: 'Lista os usuários que são gestores de alguém — útil para preencher um seletor de "gestor"
        ao associar um colaborador a um gestor em outro sistema.


        ---


        **Por que POST em vez de GET?** Este endpoint aceita uma lista dinâmica de filtros (`[{"property":
        "...", "operator": "...", "value": "..."}]`) no corpo da requisição — é uma operação de leitura
        (não grava nada), mas precisa de corpo porque a quantidade e combinação de filtros é variável,
        e requisições GET com corpo não são bem suportadas por clientes HTTP/proxies em geral. Mesmo padrão
        usado por várias APIs de busca (ex: Elasticsearch `_search`). Enviar `[]` retorna a lista sem
        filtro.'
  /logoncontrol/users/getSuperioresSubstitutos:
    get:
      tags:
      - Usuários (Colaboradores)
      summary: getSuperioresSubstitutos
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    nomManager:
                      type: string
                    nomSubstitutos:
                      type: array
                      items:
                        type: string
      description: 'Retorna, para o usuário dono do token usado na chamada (não é um parâmetro — é sempre
        o usuário autenticado), a lista dos gestores dele e, para cada gestor, os substitutos/delegados
        cadastrados para aprovações (ex: hora extra) enquanto aquele gestor está indisponível.'
  /logoncontrol/workinghours/list:
    post:
      tags:
      - Jornadas de Trabalho
      summary: List working hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
              - property: identificador
                operator: ''
                value: ''
              - property: descricao
                operator: ''
                value: ''
              - property: ativo
                operator: ''
                value: ''
              - property: padrao
                operator: ''
                value: ''
              - property: liberaRegra
                operator: ''
                value: ''
              - property: informativa
                operator: ''
                value: ''
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: &id004
                      type: object
                      properties:
                        codHorario:
                          type: integer
                        nomHorario:
                          type: string
                        txtHorario:
                          type: string
                        indAtivo:
                          type: boolean
                        indDefault:
                          type: boolean
                          description: Só pode haver uma jornada com indDefault=true no sistema todo.
                        indExcecao:
                          type: boolean
                        indNoBlock:
                          type: boolean
                          description: Se true, essa jornada nunca bloqueia logon por horário.
                        indNoBlockRep:
                          type: boolean
                        indBlockOvertimeRequest:
                          type: boolean
                        indNoControlRep:
                          type: boolean
                        indAskOfficeType:
                          type: boolean
                        codTipoJornada:
                          type: integer
                          description: Referencia um tipo cadastrado em /workinghourtype/list.
                        numTimeExtendsTwoBossesApprove:
                          type: integer
                        indCalculaCompensacao:
                          type: boolean
                        indTolerance:
                          type: boolean
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
      description: 'Lista as jornadas (grades de horário) cadastradas, paginado.


        ---


        **Por que POST em vez de GET?** Este endpoint aceita uma lista dinâmica de filtros (`[{"property":
        "...", "operator": "...", "value": "..."}]`) no corpo da requisição — é uma operação de leitura
        (não grava nada), mas precisa de corpo porque a quantidade e combinação de filtros é variável,
        e requisições GET com corpo não são bem suportadas por clientes HTTP/proxies em geral. Mesmo padrão
        usado por várias APIs de busca (ex: Elasticsearch `_search`). Enviar `[]` retorna a lista sem
        filtro.'
  /logoncontrol/workinghours/list/date/1128:
    get:
      tags:
      - Jornadas de Trabalho
      summary: List working hours date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codeDate:
                      type: integer
                      description: Id deste horário de dia-da-semana (usar em /workinghours/save/date).
                    entry:
                      type: string
                      description: Horário de entrada, formato HH:mm.
                    exit:
                      type: string
                      description: Horário de saída, formato HH:mm.
                    weekday:
                      type: string
                      description: 'Nome do dia da semana (ex: Segunda-feira).'
                    weekdayAbbr:
                      type: string
                    weekdayCode:
                      type: integer
                    numHoras:
                      type: number
                    numMinDescanso:
                      type: integer
                    numMaxDescanso:
                      type: integer
                    numMaxIntervaloDescanso:
                      type: integer
                    numMaxInterjornada:
                      type: integer
                    numLogonTolerance:
                      type: integer
                    numHoldUser:
                      type: integer
                    maxOvertimePeriod:
                      type: integer
                    codPerfilPausa:
                      type: integer
      description: 'Lista os horários de cada dia da semana dentro de uma jornada específica (`codHour`
        = id da jornada) — ex: segunda 08:00–17:00, terça 08:00–17:00 etc. Editar um desses horários (`/save/date`)
        afeta todos os usuários associados a essa jornada.'
  /logoncontrol/workinghours/availablelist:
    get:
      tags:
      - Jornadas de Trabalho
      summary: List available users
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: page
        in: query
        schema:
          type: integer
        example: '0'
      - name: size
        in: query
        schema:
          type: integer
        example: '20'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items: *id003
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
      description: Lista os usuários que ainda não estão associados a nenhuma jornada — candidatos para
        vincular via `/addTo/{codObject}/{codHour}`.
  /logoncontrol/workinghours/selectedlist/1128:
    get:
      tags:
      - Jornadas de Trabalho
      summary: List selected users
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items: *id003
      description: Lista os usuários já associados a uma jornada específica (`codJourney` = id da jornada).
  /logoncontrol/workinghours/save:
    post:
      tags:
      - Jornadas de Trabalho
      summary: Save working hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                codHorario:
                  type: integer
                  description: Omitir para criar uma jornada nova.
                nomHorario:
                  type: string
                txtHorario:
                  type: string
                indAtivo:
                  type: boolean
                indDefault:
                  type: boolean
                  description: Só pode haver uma jornada default no sistema — criar/editar uma segunda
                    retorna 400.
                indExcecao:
                  type: boolean
                indNoBlock:
                  type: boolean
                indNoBlockRep:
                  type: boolean
                indBlockOvertimeRequest:
                  type: boolean
                indNoControlRep:
                  type: boolean
                indAskOfficeType:
                  type: boolean
                numTimeExtendsTwoBossesApprove:
                  type: integer
                indCalculaCompensacao:
                  type: boolean
                indTolerance:
                  type: boolean
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: *id004
        '400':
          description: Já existe uma jornada marcada como default (indDefault=true) e esta tentativa criaria/editaria
            uma segunda.
      description: 'Cria ou atualiza uma jornada (grade de horário). Não enviar `codHorario` para criar
        uma jornada nova; enviar o campo preenchido atualiza a existente. Atenção: só pode existir uma
        jornada com `indDefault: true` por vez — tentar criar/editar uma segunda como default retorna
        400.'
  /logoncontrol/workinghours/save/date:
    post:
      tags:
      - Jornadas de Trabalho
      summary: Save working hours date
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - codeDate
              properties:
                codeDate:
                  type: integer
                  description: Id do horário de dia-da-semana a atualizar (obtido em /workinghours/list/date/{codHour}).
                entry:
                  type: string
                  description: Novo horário de entrada, formato HH:mm.
                exit:
                  type: string
                  description: Novo horário de saída, formato HH:mm.
                numHoras:
                  type: number
                numMinDescanso:
                  type: integer
                numMaxDescanso:
                  type: integer
                numMaxIntervaloDescanso:
                  type: integer
                numMaxInterjornada:
                  type: integer
                numLogonTolerance:
                  type: integer
                numHoldUser:
                  type: integer
                maxOvertimePeriod:
                  type: integer
                codPerfilPausa:
                  type: integer
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Atualizado com sucesso (sem corpo de resposta).
      description: Atualiza o horário de entrada/saída (e outros parâmetros, como tolerância e intervalo
        de descanso) de um dia da semana já cadastrado dentro de uma jornada. **Isso afeta todos os usuários
        associados a essa jornada, não é uma mudança por usuário individual.**
  /logoncontrol/workinghours/delete/2073:
    post:
      tags:
      - Jornadas de Trabalho
      summary: Delete working hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: boolean
        '500':
          description: Existem usuários associados a esta jornada — desassocie todos antes de remover.
      description: Remove uma jornada inteira. Falha (retorna erro) se ainda houver usuários associados
        a ela — é preciso desassociar todos antes (`/removeFrom`).
  /logoncontrol/workinghours/addTo/212108288/1:
    post:
      tags:
      - Jornadas de Trabalho
      summary: Add to working hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: boolean
      description: 'Associa um ou mais usuários (`codObject` no path — aceita múltiplos códigos separados
        por `/`, ex: `212108288/212108299`) a uma jornada (`codHour`). É uma substituição: se o usuário
        já tinha outra jornada associada, esse vínculo anterior é removido antes do novo ser criado. **Não
        existe conceito de data** — a troca vale a partir de agora, não é possível agendar para o futuro
        nem limitar a um único dia (ver seção de limitações conhecidas no início desta documentação).'
  /logoncontrol/workinghours/removeFrom/212108288/1:
    post:
      tags:
      - Jornadas de Trabalho
      summary: Remove to working hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example: ''
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: boolean
      description: Remove a associação entre um ou mais usuários (`codObject`, aceita múltiplos separados
        por `/`) e uma jornada (`codHour`) específica.
  /logoncontrol/workinghourtype/list:
    get:
      tags:
      - Tipos de Jornada
      summary: List Workhourstype
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        example: '0'
      - name: size
        in: query
        schema:
          type: integer
        example: '20'
      - name: txtTipoJornada
        in: query
        schema:
          type: string
      - name: txtDescricao
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        codTipoJornada:
                          type: integer
                        txtTipoJornada:
                          type: string
                        txtDescricao:
                          type: string
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean
                  empty:
                    type: boolean
      description: 'Lista os tipos de jornada cadastrados (categorias usadas para classificar jornadas,
        ex: "Normal", "Escala 12x36") — não confundir com a jornada em si (`/workinghours`), que é a grade
        de horário propriamente dita.'
  /logoncontrol/holiday/delete/{id}:
    post:
      tags:
      - Feriados
      summary: Delete
      responses:
        '200':
          description: Feriado removido. Retorna o próprio id removido.
          content:
            application/json:
              schema:
                type: integer
        '403':
          description: Usuário sem permissão para gerenciar feriados (fora de ROLE_ADMIN/ADMIN_LOGON/RH/SUSTENTACAO).
          content:
            application/json: {}
        '500':
          description: Erro inesperado ao remover o feriado.
          content:
            application/json:
              schema:
                type: integer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Código do feriado (codConcessaoFeriadoIdentificador).
      description: Remove um grupo de feriado inteiro, incluindo todas as datas cadastradas dentro dele.
  /logoncontrol/usersvacations/list:
    get:
      tags:
      - Férias e Afastamentos
      summary: Listar períodos de férias/afastamento de um usuário
      description: '**Este mesmo endpoint é usado tanto para férias quanto para afastamento de qualquer
        outro tipo (licença, atestado, etc.).** O backend não distingue os dois conceitos estruturalmente
        — não há campo de tipo/categoria na tabela; a própria integração de ponto PontoTel grava afastamento
        chamando este mesmo serviço. Use `txtComentario` para registrar o motivo/tipo do período (ex:
        "Férias", "Atestado médico", "Licença maternidade").'
      parameters:
      - name: codObjeto
        in: query
        required: true
        schema:
          type: integer
        description: Código do objeto de segurança (usuário) para o qual listar os períodos.
        example: 212108288
      responses:
        '200':
          description: Lista de períodos cadastrados para o usuário.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    codFeriasUsuarios:
                      type: integer
                    codObjetoSolicitante:
                      type: integer
                    codObjetoCadastro:
                      type: integer
                    datInicio:
                      type: string
                      format: date-time
                    datFim:
                      type: string
                      format: date-time
                    datCadastro:
                      type: string
                      format: date-time
                    txtComentario:
                      type: string
                      description: Texto livre — é o único campo que diferencia férias de outro tipo de
                        afastamento.
                    indApagado:
                      type: boolean
        '403':
          description: Usuário logado não tem permissão de ver o menu de férias/afastamento (roles admin/rh/gestor/produção/sustentação,
            ou ação LOGON_VIEW_USER_VACATION).
  /logoncontrol/usersvacations/save:
    post:
      tags:
      - Férias e Afastamentos
      summary: Criar ou atualizar um período de férias/afastamento
      description: '**Este mesmo endpoint é usado tanto para férias quanto para afastamento de qualquer
        outro tipo (licença, atestado, etc.).** O backend não distingue os dois conceitos estruturalmente
        — não há campo de tipo/categoria na tabela; a própria integração de ponto PontoTel grava afastamento
        chamando este mesmo serviço. Use `txtComentario` para registrar o motivo/tipo do período (ex:
        "Férias", "Atestado médico", "Licença maternidade"). `objetoCadastro` e `datCadastro` são preenchidos
        pelo servidor a partir do usuário autenticado — não enviar.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - objetoSolicitante
              - datInicio
              - datFim
              properties:
                codFeriasUsuarios:
                  type: integer
                  description: Omitir para criar; informar para atualizar um período existente.
                objetoSolicitante:
                  type: object
                  properties:
                    codObjeto:
                      type: integer
                  description: Usuário ao qual o período pertence.
                datInicio:
                  type: string
                  format: date-time
                datFim:
                  type: string
                  format: date-time
                txtComentario:
                  type: string
                  description: 'Motivo/tipo do período (ex: "Férias", "Atestado médico").'
              example:
                objetoSolicitante:
                  codObjeto: 212108288
                datInicio: '2026-08-01T00:00:00'
                datFim: '2026-08-10T00:00:00'
                txtComentario: Férias
      responses:
        '200':
          description: Salvo com sucesso. Corpo é o `codFeriasUsuarios` do registro (criado ou atualizado).
          content:
            application/json:
              schema:
                type: integer
        '403':
          description: Sem permissão (mesma checagem do endpoint de listagem).
        '500':
          description: Erro ao salvar (corpo retorna -1).
  /logoncontrol/usersvacations/delete:
    post:
      tags:
      - Férias e Afastamentos
      summary: Excluir um período de férias/afastamento
      parameters:
      - name: codFeriasUsuarios
        in: query
        required: true
        schema:
          type: integer
        description: Código do período a excluir.
      responses:
        '200':
          description: Excluído com sucesso.
          content:
            application/json:
              schema:
                type: boolean
        '403':
          description: Sem permissão (mesma checagem do endpoint de listagem).
        '500':
          description: Erro ao excluir (corpo retorna false).
      description: Exclui um período de férias/afastamento pelo `codFeriasUsuarios` (retornado ao criar
        via `/save` ou listado via `/list`).
  /logoncontrol/holiday/removeFrom/212108316:
    post:
      tags:
      - Feriados
      summary: Desassocia
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
              description: Ids de grupos de feriado a desvincular do usuário.
              example:
              - 1
              - 2
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
        '500':
          description: Erro inesperado ao remover o vínculo.
      description: Remove o vínculo entre um ou mais grupos de feriado e um usuário (`codObjeto` no path;
        corpo = array de ids de grupo de feriado a desvincular). É o inverso de `/holiday/relatedTo/{codObjeto}`
        -- endpoint confirmado no código (`HolidayController.removeHolidayFromObject`) mas que nunca tinha
        sido documentado (não estava na coleção Postman de origem).
