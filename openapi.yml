paths:
  /logoncontrol/user/logout:
    get:
      tags:
      - Autenticação
      summary: Logout
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /logoncontrol/public/logon/login:
    post:
      tags:
      - Autenticação
      summary: Login
      description: Endpoint de login utilizando usuario e senha. Retorna o token para acesso as outras
        APIs e as permissões de acesso do usuario em questão.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - txtLogin
              - txtSenha
              properties:
                txtLogin:
                  type: string
                  description: Login do usuário.
                txtSenha:
                  type: string
                  description: Senha em texto puro, ou a string literal 'Azure' quando a autenticação
                    é via Azure AD (fluxo separado, feature flag SCUA_LOGON_AUTH_TYPES).
              example:
                txtLogin: usuario.exemplo
                txtSenha: senha
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: Login bem-sucedido. O campo `token` é um UUID opaco (não é JWT) — o servidor valida
            esse token contra um mapa mantido em memória no processo Java (`loggedUsers`). Não há expiração
            automática visível no código atual; confirmar com o time antes de assumir TTL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  codUsuario:
                    type: integer
                  nomUsuario:
                    type: string
                  txtLogin:
                    type: string
                  txtEmail:
                    type: string
                  codObjeto:
                    type: integer
                  token:
                    type: string
                    description: UUID opaco, usar em chamadas subsequentes.
                  roles:
                    type: array
                    items:
                      type: string
                    description: 'Roles do usuário (ex: ROLE_ADMIN_LOGON, ROLE_GESTOR).'
                  acoes:
                    type: array
                    items:
                      type: object
                    description: Permissões granulares do usuário.
        '400':
          description: Usuário não encontrado (nem no banco local, nem no AD/Azure AD).
          content:
            application/json: {}
        '401':
          description: Credencial inválida, ou usuário desativado.
          content:
            application/json:
              schema:
                type: string
                description: Mensagem de erro em texto simples.
        '500':
          description: Erro inesperado durante o processo de login.
          content:
            application/json: {}
      security: []
  /logoncontrol/public/test:
    get:
      tags:
      - Autenticação
      summary: Test
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      security: []
