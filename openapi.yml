        example: application/json
      - name: size
        in: query
        schema:
          type: integer
        example: '20'
      - name: page
        in: query
        schema:
          type: integer
        example: '0'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      description: '**Por que POST em vez de GET?** Este endpoint aceita uma lista dinâmica de filtros
        (`[{"property": "...", "operator": "...", "value": "..."}]`) no corpo da requisição — é uma operação
        de leitura (não grava nada), mas precisa de corpo porque a quantidade e combinação de filtros
        é variável, e requisições GET com corpo não são bem suportadas por clientes HTTP/proxies em geral.
        Mesmo padrão usado por várias APIs de busca (ex: Elasticsearch `_search`). Enviar `[]` retorna
        a lista sem filtro.'
